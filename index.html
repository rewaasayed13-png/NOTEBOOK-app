<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{color-scheme:light dark;--bg:#F6F7F9;--sf:#FFFFFF;--sf2:#EEF0F4;--ink:#1B1F27;--mute:#5F6877;--line:#E1E4EA;--ac:#2F6BFF;--acs:#E6EEFF;--acx:#FFFFFF;--hl:#FFD84D;--pg:#FFFFFF;--bk:#E9EBEF;--sh:0 1px 2px rgba(20,24,35,.06),0 10px 30px -14px rgba(20,24,35,.28)}
@media(prefers-color-scheme:dark){:root{--bg:#0F1115;--sf:#171A20;--sf2:#1F232B;--ink:#EDEFF3;--mute:#9AA3B2;--line:#2A2F39;--ac:#8AB4F8;--acs:#1F2A44;--acx:#0F1115;--bk:#0B0C0F;--sh:0 1px 2px #0006,0 14px 34px -14px #000b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative}
.ib:hover{background:var(--sf2)}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--sf);display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.btn.pri{background:var(--ac);color:var(--acx);border-color:transparent}
.btn input{display:none}
/* المكتبة */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.brand img{width:40px;height:40px;border-radius:12px}
.brand b{font-size:20px;display:block;line-height:1.1;letter-spacing:.2px}
.brand small{color:var(--mute);font-size:13px}
.sr{position:relative;flex:1 1 220px;max-width:360px;order:3}
.sr input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--sf);padding:0 44px 0 16px;font-size:15px;outline:0}
.sr input:focus{border-color:var(--ac)}
.sr .ic{position:absolute;top:11px;right:14px;color:var(--mute);pointer-events:none}
#grid{max-width:1180px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px}
.bk{position:relative;display:flex;flex-direction:column;gap:10px;animation:up .45s both}
.cv{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:3/4;border-radius:16px;display:flex;align-items:flex-end;padding:16px;color:#fff;font-size:20px;font-weight:700;line-height:1.35;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.18),transparent 30%,rgba(0,0,0,.2))}
.cv:hover{transform:translateY(-4px)}
.cv span{position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bi{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.bar{height:4px;border-radius:4px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.bm{font-size:13px;color:var(--mute)}
.rm{position:absolute;top:8px;left:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:#0007;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.bk:hover .rm,.rm:focus-visible{opacity:1}
@media(hover:none){.rm{opacity:.9}}
.em{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--mute);line-height:2}
.em svg{width:64px;height:64px;color:var(--ac);margin-bottom:10px}
.em h2{margin:0 0 6px;color:var(--ink);font-size:22px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* القراءة */
#rb{position:fixed;top:0;inset-inline:0;z-index:6;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:transform .3s}
#rb.off{transform:translateY(-100%)}
.rt{flex:1;min-width:0;text-align:center}
#ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pgl{font-size:12px;color:var(--mute)}
#hc{position:absolute;top:2px;left:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--acx);font-size:11px;font-weight:700;display:grid;place-items:center}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:7;background:transparent}
#prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#rd{background:var(--bk);min-height:100vh}
#pages{padding:calc(76px + env(safe-area-inset-top,0px)) clamp(8px,3vw,32px) 80px}
.pg{position:relative;background:var(--pg);width:min(100%,920px);margin:0 auto 16px;border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.pg canvas{display:block;width:100%;height:100%}
.hlL,.textLayer{position:absolute;left:0;top:0;right:auto}
.hlL{inset:0;mix-blend-mode:multiply;pointer-events:none}
.hr{position:absolute;background:var(--hl);opacity:.6;border-radius:2px}
.textLayer{overflow:hidden;line-height:1;direction:ltr}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0;cursor:text;-webkit-user-select:text;user-select:text}
.textLayer ::selection{background:rgba(47,107,255,.32)}
.pg.tp{background:var(--sf);padding:clamp(22px,5vw,52px);font-family:'Noto Naskh Arabic','Amiri',Georgia,serif;font-size:clamp(19px,2.3vw,22px);line-height:2.1}
.pg.tp p{margin:0 0 1em;text-align:start}
mark{background:rgba(255,216,77,.55);color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
@media(prefers-color-scheme:dark){mark{background:#FFD84D;color:#1B1F27}}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%,60%{outline:3px solid var(--ac);outline-offset:2px}100%{outline:3px solid transparent}}
/* لوحة التظليلات */
#sc{position:fixed;inset:0;z-index:20;background:#0007}
#pn{position:fixed;z-index:21;background:var(--sf);box-shadow:0 -10px 50px #0006;display:flex;flex-direction:column;inset-inline:0;bottom:0;max-height:78vh;border-radius:24px 24px 0 0;animation:sh .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sh{from{transform:translateY(100%)}to{transform:none}}
@media(min-width:900px){#pn{top:0;bottom:0;max-height:none;width:400px;inset-inline:auto;left:0;border-radius:0 24px 24px 0;animation-name:sd}@keyframes sd{from{transform:translateX(-100%)}to{transform:none}}}
#pn header{display:flex;align-items:center;gap:6px;padding:14px 16px 10px 10px;border-bottom:1px solid var(--line)}
#pn h2{margin:0 8px;font-size:18px;flex:1}
#hl{overflow-y:auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.hi{display:flex;align-items:stretch;gap:4px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.hi .go{all:unset;box-sizing:border-box;flex:1;min-width:0;cursor:pointer;padding:12px 14px;border-radius:16px;border-inline-start:4px solid var(--hl)}
.hi .go:hover{background:var(--sf2)}
.hi q{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;quotes:none;line-height:1.9;font-size:15px}
.hi small{display:block;margin-top:6px;color:var(--mute);font-size:12px}
.hi .ib{align-self:center;width:40px;height:40px;color:var(--mute)}
/* عناصر عائمة */
#toast{position:fixed;z-index:30;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px 6px 20px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:0 12px 30px #0006;max-width:92vw;animation:up .25s}
#toast button{border:0;background:transparent;color:var(--hl);font-weight:700;min-height:40px;padding:0 12px;font-size:14px}
#pop{position:fixed;z-index:25;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:4px}
#pop button{border:0;background:transparent;min-height:44px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:600}
#pop button:hover{background:var(--sf2)}
.tg{position:absolute;top:12px;inset-inline-start:12px;z-index:1;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.6px;padding:2px 9px;border-radius:999px;background:#0005;backdrop-filter:blur(6px)}
.fm{margin-top:14px;font-size:13px;letter-spacing:.4px}
.pg.tp h1,.pg.tp h2,.pg.tp h3,.pg.tp h4,.pg.tp h5,.pg.tp h6{font-family:'Cairo',system-ui,sans-serif;font-weight:700;line-height:1.55;margin:.3em 0 .6em;text-align:start}
.pg.tp h1{font-size:1.75em}.pg.tp h2{font-size:1.5em}.pg.tp h3{font-size:1.28em}.pg.tp h4,.pg.tp h5,.pg.tp h6{font-size:1.1em}
.pg.tp p.li{position:relative;padding-inline-start:1.5em;margin-bottom:.45em}
.pg.tp p.li::before{content:"\2022";position:absolute;inset-inline-start:.4em;color:var(--ac);font-weight:700}
.pg.tp blockquote{margin:0 0 1em;padding-inline-start:1em;border-inline-start:4px solid var(--ac);color:var(--mute);text-align:start}
.pg.tp pre.cd{margin:0 0 1em;padding:14px;border-radius:12px;background:var(--sf2);font:14px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;direction:ltr;text-align:left;overflow-x:auto}
.pg.tp hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.pg.tp img{display:block;max-width:100%;height:auto;margin:0 auto 1em;border-radius:8px}
.pg.ip{padding:0}.pg.ip img{margin:0;border-radius:0;width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="lib">
<header class="top">
<div class="brand"><img src="logo.svg" alt=""><div><b>Notebook</b><small>المكتبة</small></div></div>
<button class="btn" id="inst" hidden>تثبيت التطبيق</button>
<label class="btn pri"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>إضافة كتاب<input id="add" type="file" accept=".pdf,.epub,.docx,.html,.htm,.xhtml,.md,.markdown,.txt,.cbz,application/pdf,text/plain" multiple></label>
<div class="sr"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="بحث في المكتبة" aria-label="بحث في المكتبة"></div>
</header>
<main id="grid"></main>
</section>

<section id="rd" hidden>
<div id="prog"><i></i></div>
<header id="rb">
<button class="ib" id="back" aria-label="العودة إلى المكتبة"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="rt"><div id="ttl"></div><div id="pgl"></div></div>
<button class="ib" id="hb" aria-label="التظليلات"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-8 8-6-6z"/><path d="M4 21h8"/></svg><span id="hc" hidden></span></button>
</header>
<main id="pages"></main>
</section>

<div id="sc" hidden></div>
<aside id="pn" hidden aria-label="التظليلات">
<header><h2>التظليلات</h2><button class="ib" id="cpall" aria-label="نسخ الكل"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg></button><button class="ib" id="pnx" aria-label="إغلاق"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
<div id="hl"></div>
</aside>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="pop" hidden><button>إزالة التظليل</button></div>

<script>
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const PDFOPT={disableFontFace:true,cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'};
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('ar-EG');
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
/* قاعدة البيانات: نفس قاعدة النسخ السابقة، فكتبك القديمة تبقى كما هي */
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('reader',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(st,m,fn)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(st,m);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const get=(st,k)=>tx(st,'readonly',s=>s.get(k)),put=(st,v)=>tx(st,'readwrite',s=>s.put(v)),all=st=>tx(st,'readonly',s=>s.getAll()),del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
const S={bs:[],M:{},b:null,meta:null,pdf:null,pgs:[],cur:0,io:null};
let pt;const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>S.meta&&put('meta',S.meta),250)};
let tt;function toast(t,a,fn){const e=$('#toast');e.innerHTML='';const s=document.createElement('span');s.textContent=t;e.append(s);
 if(a){const b=document.createElement('button');b.textContent=a;b.onclick=()=>{fn();e.hidden=true};e.append(b)}else e.style.paddingInlineEnd='20px';
 e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,a?5500:2600)}
const ICON={trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',book:'<path d="M4 5h7a3 3 0 013 3v11a2 2 0 00-2-2H4zM20 5h-3a3 3 0 00-3 3v11a2 2 0 012-2h4z"/>'};
const svg=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+ICON[n]+'</svg>';

/* ===== المكتبة ===== */
async function lib(){const [bs,ms]=await Promise.all([all('books'),all('meta')]);S.M={};ms.forEach(m=>S.M[m.id]=m);
 S.bs=bs.sort((a,b)=>((S.M[b.id]&&S.M[b.id].opened)||b.created)-((S.M[a.id]&&S.M[a.id].opened)||a.created));draw()}
function hue(s){let h=0;for(const c of s)h=(h*31+c.codePointAt(0))%360;return h}
function draw(){const q=$('#q').value.trim().toLowerCase(),G=$('#grid');G.innerHTML='';
 if(!S.bs.length){G.innerHTML='<div class="em">'+svg('book')+'<h2>المكتبة فارغة</h2><div>اضغط/ي «إضافة كتاب» لبدء القراءة.</div><div class="fm">PDF · EPUB · DOCX · HTML · MD · TXT · CBZ</div></div>';return}
 const list=S.bs.filter(b=>b.name.toLowerCase().includes(q));
 if(!list.length){G.innerHTML='<div class="em"><div>لا توجد نتائج مطابقة.</div></div>';return}
 list.forEach((b,i)=>{const m=S.M[b.id]||{},n=(m.hl||[]).length,pc=m.total?Math.round(100*((m.last||0)+1)/m.total):0,h=hue(b.name);
  const c=document.createElement('div');c.className='bk';c.style.animationDelay=Math.min(i,10)*.04+'s';
  c.innerHTML='<button class="cv"><em class="tg"></em><span></span></button><button class="rm" aria-label="حذف الكتاب">'+svg('trash')+'</button><div class="bi"><div class="bar"><i></i></div><div class="bm"></div></div>';
  const cv=c.querySelector('.cv');cv.style.background='linear-gradient(150deg,hsl('+h+' 52% 46%),hsl('+(h+34)+' 58% 26%))';
  cv.querySelector('span').textContent=b.name;cv.querySelector('.tg').textContent=(b.type||'').toUpperCase();cv.dir='auto';cv.onclick=()=>openBook(b.id);
  c.querySelector('.bar i').style.width=pc+'%';
  c.querySelector('.bm').textContent=(m.total?fmt(pc)+'٪ مقروء':'لم تبدأ/ي القراءة بعد')+(n?' · '+fmt(n)+(n===1?' تظليل':' تظليلات'):'');
  c.querySelector('.rm').onclick=async()=>{if(confirm('حذف «'+b.name+'» وجميع تظليلاته؟')){await del('books',b.id);await del('meta',b.id);lib()}};
  G.appendChild(c)})}
$('#q').oninput=draw;
const typeOf=f=>{const n=f.name.toLowerCase();if(/\.pdf$/.test(n)||f.type==='application/pdf')return'pdf';if(/\.epub$/.test(n))return'epub';if(/\.docx$/.test(n))return'docx';if(/\.(html?|xhtml)$/.test(n))return'html';if(/\.(md|markdown)$/.test(n))return'md';if(/\.cbz$/.test(n))return'cbz';if(/\.(txt|text)$/.test(n)||(f.type||'').startsWith('text/'))return'txt';return null};
$('#add').onchange=async e=>{for(const f of e.target.files){const t=typeOf(f);if(!t){toast('صيغة غير مدعومة: '+f.name);continue}
 await put('books',{id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),type:t,blob:f,created:Date.now()})}
 e.target.value='';navigator.storage&&navigator.storage.persist&&navigator.storage.persist();lib()};
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true}};

/* ===== أدوات القراءة ===== */
function pdfLib(){if(window.pdfjsLib)return Promise.resolve();
 const L=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 return L('lib/pdf.min.js').then(()=>'lib/pdf.worker.min.js').catch(()=>L(CDN+'pdf.min.js').then(()=>CDN+'pdf.worker.min.js')).then(w=>{pdfjsLib.GlobalWorkerOptions.workerSrc=w})}
async function readTxt(bl){const u=new Uint8Array(await bl.arrayBuffer());
 try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(_){}
 if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u);
 if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u);
 return new TextDecoder('windows-1256').decode(u)}
/* ===== دعم الصيغ المختلفة ===== */
const ZIP='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',MAM='https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js';
const need=(g,src)=>window[g]?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('يلزم الاتصال بالإنترنت لتحميل هذه الصيغة أول مرة'));document.head.appendChild(e)});
const mimeOf=n=>({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',avif:'image/avif'})[n.split('.').pop().toLowerCase()]||'application/octet-stream';
const T=x=>x.replace(/\s+/g,' ').trim();
const SKIP=new Set(['script','style','nav','head','noscript','template']);
const BLK='p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,table,hr,img,ul,ol,div,section,article,figure';
function walk(e,out,q){for(const c of e.children){const g=c.tagName.toLowerCase();if(SKIP.has(g))continue;
 if(/^h[1-6]$/.test(g)){const t=T(c.textContent);if(t)out.push({k:g,t});c.querySelectorAll('img').forEach(i=>out.push({k:'img',src:i.getAttribute('src')}))}
 else if(g==='pre'){const t=c.textContent.replace(/\s+$/,'');if(t.trim())out.push({k:'pre',t})}
 else if(g==='hr')out.push({k:'hr'});
 else if(g==='img'){const s=c.getAttribute('src');if(s)out.push({k:'img',src:s})}
 else if(g==='table'){c.querySelectorAll('tr').forEach(r=>{const t=T([...r.children].map(x=>T(x.textContent)).filter(Boolean).join(' | '));if(t)out.push({k:'p',t})})}
 else if(g==='li'){const k=c.cloneNode(true);k.querySelectorAll('ul,ol').forEach(x=>x.remove());const t=T(k.textContent);if(t)out.push({k:'li',t});c.querySelectorAll(':scope > ul,:scope > ol').forEach(x=>walk(x,out,q))}
 else if(g==='blockquote'){if(c.querySelector(BLK))walk(c,out,true);else{const t=T(c.textContent);if(t)out.push({k:'q',t})}}
 else if(g==='p'){const t=T(c.textContent);if(t)out.push({k:q?'q':'p',t});c.querySelectorAll('img').forEach(i=>out.push({k:'img',src:i.getAttribute('src')}))}
 else if(c.querySelector(BLK))walk(c,out,q);
 else{const t=T(c.textContent);if(t)out.push({k:q?'q':'p',t})}}}
function mdBlocks(t){const out=[];let buf=[],code=null;const fl=()=>{if(buf.length){out.push({k:'p',t:buf.join(' ')});buf=[]}};
 const inl=s=>s.replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/(\*\*|__)(.+?)\1/g,'$2').replace(/`([^`]+)`/g,'$1').trim();
 t.split(/\r?\n/).forEach(l=>{if(/^```/.test(l)){if(code===null){fl();code=[]}else{out.push({k:'pre',t:code.join('\n')});code=null}return}
  if(code!==null){code.push(l);return}let m;
  if(m=l.match(/^(#{1,6})\s+(.*)$/)){fl();out.push({k:'h'+m[1].length,t:inl(m[2])})}
  else if(m=l.match(/^\s*(?:[-*+]|\d+[.)])\s+(.*)$/)){fl();out.push({k:'li',t:inl(m[1])})}
  else if(m=l.match(/^>\s?(.*)$/)){fl();out.push({k:'q',t:inl(m[1])})}
  else if(/^\s*([-*_]\s*){3,}$/.test(l)){fl();out.push({k:'hr'})}
  else if(!l.trim())fl();else buf.push(inl(l))});fl();return out.filter(b=>b.k==='hr'||b.t)}
async function epubChapters(blob){await need('JSZip',ZIP);const z=await JSZip.loadAsync(blob),rd=async p=>z.file(p)?z.file(p).async('string'):'';
 const P=s=>new DOMParser().parseFromString(s,'text/xml');const opfPath=P(await rd('META-INF/container.xml')).querySelector('rootfile').getAttribute('full-path');
 const opf=P(await rd(opfPath)),base=opfPath.replace(/[^/]*$/,''),man={};
 opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
 const norm=p=>{const a=[];p.split('/').forEach(x=>{if(x==='..')a.pop();else if(x&&x!=='.')a.push(x)});return a.join('/')};
 const chs=[];
 for(const it of opf.querySelectorAll('spine > itemref')){const href=man[it.getAttribute('idref')];if(!href)continue;
  const path=norm(base+decodeURIComponent(href.split('#')[0])),html=await rd(path);if(!html)continue;
  const doc=new DOMParser().parseFromString(html,'text/html'),dir=path.replace(/[^/]*$/,'');
  for(const im of doc.querySelectorAll('img')){const s=im.getAttribute('src')||'';if(!s||/^(data|https?):/i.test(s))continue;
   const f=z.file(norm(dir+decodeURIComponent(s.split('#')[0])));if(f)im.setAttribute('src',URL.createObjectURL(new Blob([await f.async('arraybuffer')],{type:mimeOf(s)})))}
  const o=[];walk(doc.body,o);if(o.length)chs.push(o)}
 return chs}
async function cbzChapters(blob){await need('JSZip',ZIP);const z=await JSZip.loadAsync(blob);
 const fs=Object.keys(z.files).filter(n=>!z.files[n].dir&&/\.(jpe?g|png|gif|webp|avif)$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})),o=[];
 for(const n of fs)o.push({k:'img',src:URL.createObjectURL(new Blob([await z.files[n].async('arraybuffer')],{type:mimeOf(n)}))});return[o]}
function paginate(chs){const pages=[];chs.forEach(ch=>{let c=[],n=0;const fl=()=>{if(c.length)pages.push(c);c=[];n=0};
 ch.forEach(b=>{if(b.k==='img'){fl();pages.push([b]);return}if(/^h[1-3]$/.test(b.k)&&n>350)fl();c.push(b);n+=(b.t||'').length;if(n>1100)fl()});fl()});return pages}
async function buildPages(b){const t=b.type;let chs;
 if(t==='txt')chs=[(await readTxt(b.blob)).split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>({k:'p',t:x}))];
 else if(t==='md')chs=[mdBlocks(await readTxt(b.blob))];
 else if(t==='html'){const o=[];walk(new DOMParser().parseFromString(await readTxt(b.blob),'text/html').body,o);chs=[o]}
 else if(t==='docx'){await need('mammoth',MAM);const r=await mammoth.convertToHtml({arrayBuffer:await b.blob.arrayBuffer()}),o=[];walk(new DOMParser().parseFromString(r.value,'text/html').body,o);chs=[o]}
 else if(t==='epub')chs=await epubChapters(b.blob);
 else if(t==='cbz')chs=await cbzChapters(b.blob);
 else throw new Error('صيغة غير مدعومة');
 const pages=paginate(chs);if(!pages.length)throw new Error('لا يوجد محتوى قابل للعرض');return pages}
function renderBlocks(d,p){const host=d.firstChild;
 p.forEach((b,j)=>{if(b.k==='img'){const e=document.createElement('img');e.src=b.src;e.alt='';e.loading='lazy';host.appendChild(e);return}
  if(b.k==='hr'){host.appendChild(document.createElement('hr'));return}
  const e=document.createElement(/^h[1-6]$/.test(b.k)?b.k:b.k==='q'?'blockquote':b.k==='pre'?'pre':'p');
  if(b.k==='li')e.className='li';if(b.k==='pre')e.className='cd';e.dir=b.k==='pre'?'ltr':'auto';e.dataset.t=b.t;e.dataset.pi=j;e.textContent=b.t;host.appendChild(e)})}
function mk(i,inner,ratio,cls){const d=document.createElement('div');d.className='pg'+(cls?' '+cls:'');d.dataset.i=i;if(ratio)d.style.aspectRatio=ratio;d.innerHTML=inner;$('#pages').appendChild(d);S.pgs.push(d);return d}
async function openBook(id){const b=await get('books',id);if(!b)return;S.b=b;S.meta=(await get('meta',id))||{id};S.meta.hl=S.meta.hl||[];S.meta.opened=Date.now();
 $('#lib').hidden=true;$('#rd').hidden=false;$('#rb').classList.remove('off');$('#ttl').textContent=b.name;$('#ttl').dir='auto';$('#pages').innerHTML='';S.io&&S.io.disconnect();S.pgs=[];S.cur=0;scrollTo(0,0);
 try{
  if(b.type==='pdf'){await pdfLib();S.pdf=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer(),...PDFOPT}).promise;
   const v=(await S.pdf.getPage(1)).getViewport({scale:1});
   S.io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)renderPdf(x.target)}),{rootMargin:'900px'});
   for(let i=0;i<S.pdf.numPages;i++){const d=mk(i,'<canvas></canvas><div class="hlL"></div><div class="textLayer" dir="ltr"></div>',v.width+'/'+v.height);S.io.observe(d);paintPage(d)}
   S.meta.total=S.pdf.numPages;
  }else{
   const pages=await buildPages(b);
   pages.forEach((p,i)=>{const d=mk(i,'<div class="tx"></div>',null,'tp'+(p.length===1&&p[0].k==='img'?' ip':''));renderBlocks(d,p);paintPage(d)});
   S.meta.total=pages.length;
  }}catch(err){toast('تعذّر فتح هذا الكتاب'+(err&&err.message?': '+err.message:''));closeBook();return}
 const last=Math.min(S.meta.last||0,S.pgs.length-1);if(last>0&&S.pgs[last])S.pgs[last].scrollIntoView();
 progress();count();persist();
 if(!LS.get('tip',0)){LS.set('tip',1);setTimeout(()=>toast('ظلّل/ي أي نص ليُحفظ تلقائيًا'),900)}}
async function renderPdf(d){const w=d.clientWidth;if(!w||d.dataset.w==w)return;d.dataset.w=w;
 const page=await S.pdf.getPage(+d.dataset.i+1),v0=page.getViewport({scale:1}),sc=w/v0.width,dpr=Math.min(devicePixelRatio||1,2),v=page.getViewport({scale:sc*dpr}),c=d.querySelector('canvas');
 c.width=v.width;c.height=v.height;d.style.aspectRatio=v0.width+'/'+v0.height;
 await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
 const vt=page.getViewport({scale:sc}),tl=d.querySelector('.textLayer');tl.innerHTML='';tl.style.width=vt.width+'px';tl.style.height=vt.height+'px';
 try{pdfjsLib.renderTextLayer({textContentSource:await page.getTextContent(),container:tl,viewport:vt,textDivs:[]})}catch(_){}}
function closeBook(){persist();$('#rd').hidden=true;$('#lib').hidden=false;closePanel();hidePop();S.io&&S.io.disconnect();setTimeout(lib,350)}
$('#back').onclick=closeBook;
function progress(){const n=S.pgs.length;if(!n)return;const y=innerHeight*.4;let k=S.cur;
 for(let i=0;i<n;i++){const r=S.pgs[i].getBoundingClientRect();if(r.top<=y&&r.bottom>y){k=i;break}}
 S.cur=k;S.meta.last=k;$('#pgl').textContent='صفحة '+fmt(k+1)+' من '+fmt(n);$('#prog i').style.width=(100*(k+1)/n)+'%'}
let ly=0,raf=0;addEventListener('scroll',()=>{if($('#rd').hidden)return;if(!raf)raf=requestAnimationFrame(()=>{raf=0;progress();persist();const y=scrollY;
 if(y>ly+8&&y>90)$('#rb').classList.add('off');else if(y<ly-8||y<90)$('#rb').classList.remove('off');ly=y;hidePop()})},{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.b&&S.b.type==='pdf'&&!$('#rd').hidden)S.pgs.forEach(d=>{const r=d.getBoundingClientRect();if(r.bottom>-900&&r.top<innerHeight+900)renderPdf(d)})},250)});

/* ===== التظليل (الأداة الوحيدة) ===== */
const lines=rs=>{rs.sort((a,b)=>a.t-b.t||a.l-b.l);const g=[];
 rs.forEach(r=>{const L=g.find(x=>Math.abs((x.t+x.h/2)-(r.t+r.h/2))<Math.min(x.h,r.h)*.5);L?L.a.push(r):g.push({t:r.t,h:r.h,a:[r]})});
 const o=[];g.forEach(L=>{L.a.sort((a,b)=>a.l-b.l);let c=null;L.a.forEach(r=>{if(c&&r.l<=c.l+c.w+Math.min(c.h,r.h)*.6){const e=Math.max(c.l+c.w,r.l+r.w),t=Math.min(c.t,r.t),bt=Math.max(c.t+c.h,r.t+r.h);c.w=e-c.l;c.t=t;c.h=bt-t}else{c={...r};o.push(c)}})});return o};
const off=(p,n,o)=>{const r=document.createRange();r.selectNodeContents(p);r.setEnd(n,o);return r.toString().length};
function partsOf(rg){const parts=[];
 if(S.b.type==='pdf'){S.pgs.forEach(d=>{if(!rg.intersectsNode(d.querySelector('.textLayer')))return;
   const pr=d.getBoundingClientRect(),A=pr.width*pr.height,rs=[];
   for(const r of rg.getClientRects()){if(r.width<2||r.height<2||r.width*r.height>A*.3)continue;const cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(cx<pr.left||cx>pr.right||cy<pr.top||cy>pr.bottom)continue;rs.push({l:r.left-pr.left,t:r.top-pr.top,w:r.width,h:r.height})}
   if(rs.length)parts.push({pg:+d.dataset.i,rects:lines(rs).map(r=>[+(r.l/pr.width).toFixed(4),+(r.t/pr.height).toFixed(4),+(r.w/pr.width).toFixed(4),+(r.h/pr.height).toFixed(4)])})})}
 else S.pgs.forEach(d=>d.querySelectorAll('[data-t]').forEach(p=>{if(!rg.intersectsNode(p))return;let s=0,e=p.textContent.length;
   if(p.contains(rg.startContainer))s=off(p,rg.startContainer,rg.startOffset);if(p.contains(rg.endContainer))e=off(p,rg.endContainer,rg.endOffset);
   if(e>s)parts.push({pg:+d.dataset.i,pi:+p.dataset.pi,s,e})}));
 return parts}
function paintPage(d){const i=+d.dataset.i;
 if(S.b.type==='pdf'){const L=d.querySelector('.hlL');L.innerHTML='';
  S.meta.hl.forEach(h=>h.parts.forEach(pt=>{if(pt.pg!==i||!pt.rects)return;pt.rects.forEach(r=>{const e=document.createElement('i');e.className='hr';e.dataset.h=h.id;e.style.cssText='left:'+r[0]*100+'%;top:'+r[1]*100+'%;width:'+r[2]*100+'%;height:'+r[3]*100+'%';L.appendChild(e)})}));return}
 d.querySelectorAll('[data-t]').forEach(p=>{const t=p.dataset.t,pi=+p.dataset.pi,rs=[];
  S.meta.hl.forEach(h=>h.parts.forEach(q=>{if(q.pg===i&&q.pi===pi)rs.push([q.s,q.e,h.id])}));
  if(!rs.length){if(p.childNodes.length!==1||p.firstChild.nodeType!==3)p.textContent=t;return}
  rs.sort((a,b)=>a[0]-b[0]);const m=[];rs.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())});
  p.textContent='';let pos=0;m.forEach(r=>{if(r[0]>pos)p.append(t.slice(pos,r[0]));const k=document.createElement('mark');k.dataset.h=r[2];k.textContent=t.slice(r[0],r[1]);p.append(k);pos=r[1]});if(pos<t.length)p.append(t.slice(pos))})}
const repaint=h=>{new Set(h.parts.map(p=>p.pg)).forEach(i=>S.pgs[i]&&paintPage(S.pgs[i]))};
function count(){const n=S.meta.hl.length;$('#hc').hidden=!n;$('#hc').textContent=fmt(n)}
function removeHl(id){const h=S.meta.hl.find(x=>x.id===id);if(!h)return;S.meta.hl=S.meta.hl.filter(x=>x!==h);repaint(h);count();persist();if(!$('#pn').hidden)drawPanel();
 toast('تمت إزالة التظليل','تراجع',()=>{S.meta.hl.push(h);repaint(h);count();persist();if(!$('#pn').hidden)drawPanel()})}
let st;document.addEventListener('selectionchange',()=>{clearTimeout(st);st=setTimeout(onSel,matchMedia('(pointer:coarse)').matches?700:250)});
function onSel(){if(!S.b||$('#rd').hidden||!$('#pn').hidden)return;const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;
 const rg=sel.getRangeAt(0);if(!$('#pages').contains(rg.commonAncestorContainer))return;
 const text=sel.toString().replace(/\s+/g,' ').trim();if(text.length<2)return;
 const parts=partsOf(rg);if(!parts.length)return;
 const h={id:crypto.randomUUID(),text:text.slice(0,2000),ts:Date.now(),parts};S.meta.hl.push(h);sel.removeAllRanges();repaint(h);count();persist();
 toast('تم حفظ التظليل','تراجع',()=>{S.meta.hl=S.meta.hl.filter(x=>x!==h);repaint(h);count();persist()})}
/* النقر على تظليل لإزالته */
$('#pages').addEventListener('click',e=>{const sel=getSelection();if(sel&&!sel.isCollapsed)return;const pg=e.target.closest('.pg');if(!pg){hidePop();return}let id=null;
 if(e.target.tagName==='MARK')id=e.target.dataset.h;
 else if(S.b.type==='pdf'){const pr=pg.getBoundingClientRect(),x=(e.clientX-pr.left)/pr.width,y=(e.clientY-pr.top)/pr.height,i=+pg.dataset.i;
  S.meta.hl.forEach(h=>h.parts.forEach(q=>{if(q.pg===i&&q.rects&&q.rects.some(r=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]))id=h.id}))}
 if(id)showPop(e.clientX,e.clientY,id);else hidePop()});
function showPop(x,y,id){const p=$('#pop');p.hidden=false;p.style.left=Math.max(8,Math.min(innerWidth-170,x-70))+'px';p.style.top=Math.max(8,y-64)+'px';p.firstChild.onclick=()=>{hidePop();removeHl(id)}}
function hidePop(){$('#pop').hidden=true}
/* لوحة التظليلات */
const order=h=>{const q=h.parts[0];return q.pg*1e6+(q.rects?q.rects[0][1]*1e5:q.pi*1e3+q.s/1e3)};
function drawPanel(){const L=$('#hl');L.innerHTML='';const hs=S.meta.hl.slice().sort((a,b)=>order(a)-order(b));
 if(!hs.length){L.innerHTML='<div class="em" style="padding:40px 10px">لا توجد تظليلات في هذا الكتاب بعد.<br>ظلّل/ي أي نص أثناء القراءة ليُحفظ هنا تلقائيًا.</div>';return}
 hs.forEach(h=>{const it=document.createElement('div');it.className='hi';it.innerHTML='<button class="go"><q dir="auto"></q><small></small></button><button class="ib" aria-label="حذف التظليل">'+svg('trash')+'</button>';
  it.querySelector('q').textContent=h.text;it.querySelector('small').textContent='صفحة '+fmt(h.parts[0].pg+1);
  it.querySelector('.go').onclick=()=>jump(h);it.querySelector('.ib').onclick=()=>removeHl(h.id);L.appendChild(it)})}
function jump(h){closePanel();const q=h.parts[0],d=S.pgs[q.pg];if(!d)return;let y=d.getBoundingClientRect().top+scrollY;
 if(q.rects)y+=q.rects[0][1]*d.clientHeight;else{const k=d.querySelector('mark[data-h="'+h.id+'"]');if(k)y=k.getBoundingClientRect().top+scrollY}
 scrollTo({top:Math.max(0,y-160),behavior:'smooth'});
 setTimeout(()=>document.querySelectorAll('[data-h="'+h.id+'"]').forEach(e=>{e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1800)}),450)}
function openPanel(){drawPanel();$('#sc').hidden=false;$('#pn').hidden=false;$('#rb').classList.remove('off')}
function closePanel(){$('#sc').hidden=true;$('#pn').hidden=true}
$('#hb').onclick=openPanel;$('#pnx').onclick=closePanel;$('#sc').onclick=closePanel;
$('#cpall').onclick=()=>{const t=S.meta.hl.slice().sort((a,b)=>order(a)-order(b)).map(h=>'«'+h.text+'» — صفحة '+fmt(h.parts[0].pg+1)).join('\n\n');
 navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('تم نسخ التظليلات'),()=>toast('تعذّر النسخ'))};
addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();hidePop()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
lib();
