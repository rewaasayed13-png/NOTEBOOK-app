<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>مكتبتي</title>
<style>
*{box-sizing:border-box}
:root{--amber:#F5B544;--ink:#F4F1FF;--mute:#B9B6E0;--line:#4A4FB0}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:linear-gradient(180deg,#12143A,#1D2160) fixed;color:var(--ink);min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button,textarea{font-family:inherit}
.b{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;cursor:pointer}
.b:hover{border-color:var(--amber)}
.b.on,.b.pri{background:var(--amber);border-color:var(--amber);color:#1B1740;font-weight:700}
.b.red{color:#FF9A9A;border-color:#FF9A9A}
label.b{display:inline-flex;align-items:center}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
header{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:#12143Aee;backdrop-filter:blur(8px);border-bottom:1px solid #2E3290}
.brand{display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:.3px}
#lib{max-width:1100px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px}
#lib>p{grid-column:1/-1;text-align:center;color:var(--mute);font-size:18px;line-height:2;padding:40px 0}
.card{display:flex;flex-direction:column;gap:10px}
.cover{position:relative;height:230px;border-radius:6px 14px 14px 6px;color:#fff;font-size:19px;font-weight:700;line-height:1.5;padding:18px 16px;display:flex;align-items:flex-end;cursor:pointer;word-break:break-word;box-shadow:inset -12px 0 0 #0003,0 12px 24px #0006}
.cover::before{content:"";position:absolute;top:0;left:20px;width:16px;height:38px;background:var(--amber);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
#msg{margin:16px 20px 0;padding:12px 16px;background:var(--amber);color:#1B1740;border-radius:12px}
#rd{padding:16px 12px}
.pg{position:relative;background:#FFFDF7;color:#1F2430;margin:0 auto 18px;max-width:900px;border-radius:6px;box-shadow:0 10px 30px #0006}
.pg canvas{display:block;width:100%;border-radius:6px}
.tx{padding:28px;font-size:20px;line-height:2}.tx p{margin:0 0 18px}
.ov,.nt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
body:not([data-tool=none]) .ov{pointer-events:auto;touch-action:none}
.note{position:absolute;pointer-events:auto;min-width:96px;display:flex;flex-direction:column;border:1px solid #0003;border-radius:12px;box-shadow:0 8px 22px #0005;overflow:hidden}
.nh{display:flex;align-items:center;gap:4px;padding:3px 6px;background:#0002}
.gr{flex:1;cursor:grab;font-size:15px;user-select:none;touch-action:none;padding:6px 2px;white-space:nowrap}
.nh button{border:0;background:transparent;font-size:16px;cursor:pointer;color:inherit;min-width:30px;min-height:30px}
input[type=color]{width:28px;height:28px;padding:0;border:2px solid #fff;border-radius:50%;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.note textarea{flex:1;width:100%;min-height:0;border:0;background:transparent;resize:none;padding:8px 10px;color:inherit;line-height:1.7;outline:0}
.rz{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,#0007 50% 58%,transparent 58% 70%,#0007 70% 78%,transparent 78%)}
#sheet{position:fixed;inset:0;z-index:9;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#12143A,#1D2160);padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.shw{max-width:900px;margin:0 auto}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;margin:0 -16px 14px;background:#12143Aee;backdrop-filter:blur(8px);border-bottom:2px solid var(--amber)}
.sh h2{margin:0;font-size:22px}
.qc{border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px #0005}
.qc textarea{width:100%;min-height:96px;border:0;background:transparent;font-size:19px;line-height:1.9;resize:vertical;color:inherit;outline:0}
.qc .row{margin:8px 0 0;align-items:center}
.qc .b{background:#fff;color:#1F2430;border-color:#0003;min-height:40px}
.qc .b.red{color:#A23B3B}
.nbw{padding:14px;border-radius:14px;border:1px solid #D9D2C3;background-size:cover;background-position:center}
#bar .b{padding:0 12px;min-height:40px;font-size:14px}
#bar{position:fixed;inset:auto 0 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#12143Af2;backdrop-filter:blur(10px);border-top:2px solid var(--amber);z-index:5}
#lbl{min-width:96px;text-align:center;color:var(--mute);font-size:14px}
#panel{position:fixed;inset:auto 0 0 0;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-height:55vh;overflow-y:auto;padding:16px 20px;background:#1B1F57;border-radius:22px 22px 0 0;border-top:1px solid var(--line);box-shadow:0 -8px 30px #0008;z-index:4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid #FFFFFF55;cursor:pointer}.sw.sq{border-radius:12px}
.it{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3A3F8F}.it span{flex:1 1 220px;font-size:17px}
#nbt{width:100%;height:calc(100vh - 300px);height:calc(100dvh - 300px);min-height:320px;padding:12px;border:0;border-radius:10px;background:#FFFDF7cc;color:#1F2430;font-size:18px;line-height:1.8}
[hidden]{display:none!important}
</style>
<style>
/* تحسينات الشكل: خلفية مثقفة + ستايل NotebookLM */
:root{--line:#3C4F68}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 56px),radial-gradient(ellipse at 50% -10%,#3A5068 0%,#1B2636 48%,#101722 100%) fixed}
header,.sh{background:#101722ee;border-bottom-color:#2C3C52}
.sh{border-bottom:2px solid var(--amber)}
#bar{background:#101722f2}
#panel{background:#172231;border-radius:28px 28px 0 0}
#sheet{background:radial-gradient(ellipse at 50% -10%,#3A5068 0%,#1B2636 48%,#101722 100%)}
.cover{border-radius:6px 18px 18px 6px}
.pg,.pg canvas{border-radius:14px}
.pg{box-shadow:0 18px 50px -20px #000c}
.qc{border-radius:22px}
.note{border-radius:16px}
.nbw{border-radius:20px}
.it{border-bottom-color:#2C3C52}
#msg{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:30;margin:0;padding:10px 22px;border-radius:999px;box-shadow:0 10px 30px #0008;animation:tp .25s ease}
@keyframes tp{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.nh button{transition:transform .15s,background .2s}
.nh .sv.pop{background:#1F8A5B;color:#fff;border-radius:50%;animation:pp .3s ease}
@keyframes pp{50%{transform:scale(1.3)}}
</style>
<style>
/* شريط الأدوات كستارة من فوق */
body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#bar{inset:0 0 auto 0;z-index:8;border-top:0;border-bottom:2px solid var(--amber);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-radius:0 0 22px 22px;box-shadow:0 14px 30px -12px #000a;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#bar.up{transform:translateY(-100%);box-shadow:none}
#tg{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:84px;height:30px;padding:0;border:0;border-bottom:2px solid var(--amber);border-radius:0 0 18px 18px;background:#101722f2;color:var(--amber);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
#tg svg{transition:transform .35s}
#bar.up #tg svg{transform:rotate(180deg)}
#panel{inset:auto 0 auto 0;bottom:auto!important;top:var(--bh,70px);z-index:7;padding-top:40px;border-radius:0 0 28px 28px;border-top:0;box-shadow:0 18px 30px #0008}
#rd{padding-top:calc(var(--pad,0px) + 16px);transition:padding-top .35s}
</style>
<style>
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#panel .b{display:inline-flex;align-items:center;gap:8px;border-radius:16px}
#panel .b .ic{color:var(--amber)}
#panel .b.on .ic{color:#1B1740}
#bar{touch-action:none}
#bar .b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:56px;padding:6px 10px;border-radius:16px;border-color:transparent;background:#ffffff12;font-size:12px}
#bar .b .ic{width:22px;height:22px;color:var(--amber)}
#bar .b.on .ic{color:#1B1740}
#tg{touch-action:none}
</style>
<style>.tp .tx b{display:block;color:#6B6055;font-size:14px;margin-bottom:10px}.tp .body{white-space:pre-wrap;font-family:'Amiri','Traditional Arabic','Segoe UI',Tahoma,serif;font-size:21px;line-height:2.1}.tp .row{margin:16px 0 0}.tp .b{color:#1F2430;border-color:#C9BCA2;font-size:13px;min-height:40px}</style>
<style>
/* واجهة الاستقبال والمكتبة */
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
#wel{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 56px),radial-gradient(ellipse at 50% 0%,#3A5068 0%,#1B2636 50%,#101722 100%);overflow:hidden;transition:opacity .7s ease,transform .7s ease}
#wel.out{opacity:0;transform:scale(1.06);pointer-events:none}
#wel .o1,#wel .o2{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
#wel .o1{width:340px;height:340px;background:#F5B544;top:-90px;left:-70px;opacity:.18}
#wel .o2{width:380px;height:380px;background:#4348B8;bottom:-120px;right:-90px}
#wel .wc{position:relative;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px}
#wel .wl{animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 18px 30px #0008)}
#wel .wc>*{animation:fu .8s both}
#wel .wl{animation:fl 4s ease-in-out infinite,fu .8s both}
#wel h1{margin:6px 0 0;font-size:44px;letter-spacing:.5px;font-family:'Amiri','Traditional Arabic',serif;animation-delay:.15s}
#wel p{margin:0;color:var(--mute);font-size:17px;line-height:2;animation-delay:.3s}
#wel .b{animation-delay:.45s;margin-top:10px;min-height:54px;padding:0 32px;font-size:17px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 14px 30px -10px #F5B544aa}
#wel .b .ic{color:#1B1740}
#hero{display:none;max-width:1100px;margin:0 auto;padding:36px 24px 0}
body:has(#lib:not([hidden])) #hero{display:block;animation:fu .7s both}
#hero .hk{color:var(--amber);font-size:14px;font-weight:700;letter-spacing:.5px}
#hero h2{margin:6px 0 4px;font-size:38px;font-family:'Amiri','Traditional Arabic',serif}
#hero p{margin:0;color:var(--mute);font-size:16px;line-height:1.9}
#lib{padding-top:22px;gap:30px}
.card{animation:fu .6s both}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(6){animation-delay:.3s}
.cover{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;font-family:'Amiri','Traditional Arabic',serif;font-size:21px}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,rgba(255,255,255,.16),transparent 35%,rgba(0,0,0,.18));pointer-events:none}
.cover:hover{transform:translateY(-8px) rotate(-1.2deg);box-shadow:inset -12px 0 0 #0003,0 24px 36px -8px #000a}
.card .b.red{border-color:transparent;background:#ffffff0d;border-radius:14px;min-height:38px;font-size:13px}
#lib>p{border:1.5px dashed #3C4F68;border-radius:26px;background:#ffffff08;margin:10px 0}
#rd:not([hidden]){animation:fi .5s both}
@media (prefers-reduced-motion:reduce){#wel *,.card,#hero{animation:none!important}#wel,.cover{transition:none}}
</style>
</head>
<body data-tool="none">
<div id="wel" role="dialog" aria-label="مرحباً"><i class="o1"></i><i class="o2"></i><div class="wc"><div class="wl"><svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4348B8"/><stop offset="1" stop-color="#12143A"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg2)"/><path d="M32 20C26 16 18 16 12 18V44C18 42 26 42 32 46Z" fill="#F4F1FF"/><path d="M32 20C38 16 46 16 52 18V44C46 42 38 42 32 46Z" fill="#D7D2F4"/><path d="M38 13H46V30L42 26L38 30Z" fill="#F5B544"/><circle cx="19" cy="11" r="2.2" fill="#F5B544"/></svg></div><h1>مكتبتي</h1><p>اقري، ظلّلي، اكتبي ملاحظاتك واقتباساتك.<br>كل كتبك وأفكارك في مكان واحد هادي.</p><button id="welgo" class="b pri">ابدأي القراءة<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div></div>
<header><div class="brand"><svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4348B8"/><stop offset="1" stop-color="#12143A"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M32 20C26 16 18 16 12 18V44C18 42 26 42 32 46Z" fill="#F4F1FF"/><path d="M32 20C38 16 46 16 52 18V44C46 42 38 42 32 46Z" fill="#D7D2F4"/><path d="M38 13H46V30L42 26L38 30Z" fill="#F5B544"/><circle cx="19" cy="11" r="2.2" fill="#F5B544"/></svg><h1 id="ttl">مكتبتي</h1></div><div class="row" style="margin:0"><button class="b" id="inst" hidden>تثبيت التطبيق</button><label class="b pri">إضافة كتاب (PDF أو نص)<input id="add" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain" multiple></label></div></header>

<button id="tg" aria-label="طي الأدوات" aria-expanded="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></nav>
<script>
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const $=s=>document.querySelector(s);
const IC={"read": "<path d=\"M5 3l14 8-6 2-2 6z\"/>", "pen": "<path d=\"M4 20l1-4L16 5l3 3L8 19z\"/><path d=\"M14 7l3 3\"/>", "hl": "<path d=\"M14 4l6 6-8 8-6-6z\"/><path d=\"M4 21h8\"/>", "quote": "<path d=\"M7 17h3l1-5V7H5v5h3\"/><path d=\"M16 17h3l1-5V7h-6v5h3\"/>", "note": "<path d=\"M5 4h14v11l-5 5H5z\"/><path d=\"M14 20v-5h5\"/>", "arrow": "<path d=\"M5 12h14\"/><path d=\"M13 6l6 6-6 6\"/>", "circle": "<circle cx=\"12\" cy=\"12\" r=\"8\"/>", "rect": "<rect x=\"4\" y=\"5\" width=\"16\" height=\"14\" rx=\"3\"/>", "move": "<path d=\"M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3\"/>", "erase": "<path d=\"M20 20H9l-5-5 10-10 6 6z\"/><path d=\"M7 12l6 6\"/>", "books": "<path d=\"M5 4h4v16H5zM11 4h4v16h-4z\"/><path d=\"M17.5 6l3 .8-3.5 13.2-3-.8z\"/>", "prev": "<path d=\"M9 6l6 6-6 6\"/>", "next": "<path d=\"M15 6l-6 6 6 6\"/>", "tools": "<path d=\"M4 8h9M17 8h3M4 16h3M11 16h9\"/><circle cx=\"15\" cy=\"8\" r=\"2\"/><circle cx=\"9\" cy=\"16\" r=\"2\"/>", "mark": "<path d=\"M7 4h10v16l-5-4-5 4z\"/>", "nb": "<path d=\"M6 3h12v18H6z\"/><path d=\"M10 3v18M13 8h3\"/>"};IC.text='<path d="M4 7V5h16v2M12 5v14M9 19h6"/>';
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';
const S={tool:'none',color:'#FFE680',qc:'#FFE680',tab:'tools',cur:0,io:null,sel:null};
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('reader',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(st,m,fn)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(st,m);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const get=(st,k)=>tx(st,'readonly',s=>s.get(k)),put=(st,v)=>tx(st,'readwrite',s=>s.put(v)),all=st=>tx(st,'readonly',s=>s.getAll()),del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
let pt;const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>put('meta',S.meta),300)};
const msg=t=>{const m=$('#msg');m.textContent=t||'';m.hidden=!t};
const COLORS=['linear-gradient(145deg,#2F8F8A,#14504D)','linear-gradient(145deg,#C0703F,#6E331A)','linear-gradient(145deg,#5560D8,#262B80)','linear-gradient(145deg,#A25BB0,#4B2358)'];
async function lib(){
 const bs=(await all('books')).sort((a,b)=>a.created-b.created);const L=$('#lib');L.innerHTML='';
 if(!bs.length){L.innerHTML='<p>مكتبتك فاضية لسه.<br>دوسي «إضافة كتاب» واختاري ملف PDF أو نص من الموبايل.</p>';return}
 bs.forEach((b,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<div class="cover"></div><button class="b red">حذف</button>';
 const cv=c.firstChild;cv.textContent=b.name;cv.style.background=COLORS[i%4];cv.onclick=()=>openBook(b.id);

  el.querySelector('#bgi').onchange=e=>{const f=e.target.files[0];if(!f)return;createImageBitmap(f).then(im=>{const q=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pg.img=c.toDataURL('image/jpeg',.8);persist();sheet()}).catch(()=>msg('مقدرتش أقرأ الصورة دي.'))};
 }
}
$('#sheet').onclick=e=>{if(e.target.closest('#shx'))return closeSheet();const b=e.target.closest('[data-a]');if(!b||S.sheet!=='nb')return;
 const a=b.dataset.a,v=b.dataset.v,n=S.meta.nb,pg=n.pages[n.cur];
 if(a==='np')n.cur=Math.max(0,n.cur-1);if(a==='nn')n.cur=Math.min(n.pages.length-1,n.cur+1);
 if(a==='na'){n.pages.push({bg:'#FFFFFF',img:'',text:''});n.cur=n.pages.length-1}
 if(a==='nd'&&n.pages.length>1){n.pages.splice(n.cur,1);n.cur=Math.max(0,n.cur-1)}
 if(a==='bg')pg.bg=v;if(a==='bn')pg.img='';
 persist();sheet()};
$('#svb').onclick=()=>{S.tab='saved';const p=$('#panel');p.hidden=false;$('#pen').classList.add('on');panel()};
$('#qb').onclick=()=>openSheet('quotes');$('#nbb').onclick=()=>openSheet('nb');
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=()=>{dp&&dp.prompt();$('#inst').hidden=true};
const setBH=()=>{const b=$('#bar'),r=document.documentElement.style;if(b.hidden){r.setProperty('--pad','0px');return}const h=b.offsetHeight;r.setProperty('--bh',h+'px');r.setProperty('--pad',b.classList.contains('up')?'0px':h+'px')};
new MutationObserver(setBH).observe($('#bar'),{attributes:true,attributeFilter:['hidden','class']});addEventListener('resize',setBH);setBH();
const bar=$('#bar'),tg=$('#tg');
const setUp=u=>{bar.classList.toggle('up',u);tg.setAttribute('aria-expanded',String(!u));tg.setAttribute('aria-label',u?'إنزال الأدوات':'طي الأدوات');if(u){$('#panel').hidden=true;$('#pen').classList.remove('on')}};
const dragBar=(el,tap)=>el.addEventListener('pointerdown',e=>{const y0=e.clientY,h=bar.offsetHeight,up0=bar.classList.contains('up'),base=up0?-h:0;let moved=false,pos=base;
 const mv=ev=>{const dy=ev.clientY-y0;if(!moved&&Math.abs(dy)>8){moved=true;try{el.setPointerCapture(e.pointerId)}catch(_){}bar.style.transition='none'}if(!moved)return;pos=Math.max(-h,Math.min(0,base+dy));bar.style.transform='translateY('+pos+'px)'};
 const end=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);bar.style.transition='';bar.style.transform='';if(moved)setUp(pos<-h/2);else if(tap)setUp(!up0)};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
dragBar(tg,true);dragBar(bar,false);
tg.onclick=e=>{if(e.detail===0)setUp(!bar.classList.contains('up'))};
const loadJs=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function pageText(i){const p=await S.pdf.getPage(i+1),c=await p.getTextContent(),rows=[];
 c.items.forEach(it=>{if(typeof it.str!=='string')return;const y=Math.round(it.transform[5]);let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,a:[]};rows.push(r)}r.a.push([it.transform[4],it.str])});
 rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.a.sort((a,b)=>b[0]-a[0]).map(q=>q[1]).join('').replace(/ {2,}/g,' ').trim()).filter(Boolean).join('\n')}
async function ocrPage(i){if(!window.Tesseract)await loadJs('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
 const p=await S.pdf.getPage(i+1),v=p.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
 await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return (await Tesseract.recognize(c,'ara')).data.text}
let tmTok=0;
async function setTM(on){S.tm=on;$('#tmb').classList.toggle('on',on);
 if(!on){tmTok++;$('#txv').hidden=true;$('#pages').hidden=false;return}
 if(!S.b||S.b.type!=='pdf'){S.tm=false;$('#tmb').classList.remove('on');msg('ده كتاب نصي أصلاً.');setTimeout(()=>msg(''),1800);return}
 $('#pages').hidden=true;const v=$('#txv');v.hidden=false;v.innerHTML='';const tok=++tmTok;
 for(let i=0;i<S.pdf.numPages;i++){const sec=document.createElement('section');sec.className='pg tp';
  sec.innerHTML='<div class="tx"><b></b><div class="body"></div><div class="row"><button class="b ocr">تعرّف بالصورة (OCR)</button></div></div>';
  sec.querySelector('b').textContent='صفحة '+(i+1);v.appendChild(sec);const bd=sec.querySelector('.body');
  let t=(S.meta.ocr&&S.meta.ocr[i])||'';if(!t)t=await pageText(i);if(tok!==tmTok)return;
  bd.textContent=t.trim()||'(الصفحة دي صورة من غير نص. دوسي «تعرّف بالصورة».)';
  sec.querySelector('.ocr').onclick=async e=>{const bt=e.currentTarget;bt.disabled=true;bt.textContent='جاري التعرف... أول مرة بينزّل اللغة العربية ولازم نت';
   try{const tx=await ocrPage(i);S.meta.ocr=S.meta.ocr||{};S.meta.ocr[i]=tx;persist();bd.textContent=tx.trim()||'(ما لقيتش نص)';bt.textContent='تعرّف تاني'}catch(_){bt.textContent='فشل. جرّبي تاني ولازم نت'}bt.disabled=false}}}
$('#tmb').onclick=()=>setTM(!S.tm);$('#home').addEventListener('click',()=>setTM(false));
(function(){const w=$('#wel');let seen=false;try{seen=sessionStorage.getItem('wel')}catch(_){}
if(seen){w.remove();return}
$('#welgo').onclick=()=>{w.classList.add('out');try{sessionStorage.setItem('wel','1')}catch(_){}setTimeout(()=>w.remove(),750)}})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
lib();
</script>
