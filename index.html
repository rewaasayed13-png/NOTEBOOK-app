<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12143A">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مكتبتي</title>
<style>
*{box-sizing:border-box}
:root{--amber:#F5B544;--ink:#F4F1FF;--mute:#B9B6E0;--line:#4A4FB0}
body{margin:0;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;background:linear-gradient(180deg,#12143A,#1D2160) fixed;color:var(--ink);min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button,textarea{font-family:inherit}
.b{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;cursor:pointer}
.b:hover{border-color:var(--amber)}
.b.on,.b.pri{background:var(--amber);border-color:var(--amber);color:#1B1740;font-weight:700}
.b.red{color:#FF9A9A;border-color:#FF9A9A}
label.b{display:inline-flex;align-items:center}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
header{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:#12143Aee;backdrop-filter:blur(8px);border-bottom:1px solid #2E3290}
.brand{display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:.3px}
#lib{max-width:1100px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px}
#lib>p{grid-column:1/-1;text-align:center;color:var(--mute);font-size:18px;line-height:2;padding:40px 0}
.card{display:flex;flex-direction:column;gap:10px}
.cover{position:relative;height:230px;border-radius:6px 14px 14px 6px;color:#fff;font-size:19px;font-weight:700;line-height:1.5;padding:18px 16px;display:flex;align-items:flex-end;cursor:pointer;word-break:break-word;box-shadow:inset -12px 0 0 #0003,0 12px 24px #0006}
.cover::before{content:"";position:absolute;top:0;left:20px;width:16px;height:38px;background:var(--amber);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
#msg{margin:16px 20px 0;padding:12px 16px;background:var(--amber);color:#1B1740;border-radius:12px}
#rd{padding:16px 12px}
.pg{position:relative;background:#FFFDF7;color:#1F2430;margin:0 auto 18px;max-width:900px;border-radius:6px;box-shadow:0 10px 30px #0006}
.pg canvas{display:block;width:100%;border-radius:6px}
.tx{padding:28px;font-size:20px;line-height:2}.tx p{margin:0 0 18px}
.ov,.nt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
body:not([data-tool=none]) .ov{pointer-events:auto;touch-action:none}
.note{position:absolute;pointer-events:auto;min-width:96px;display:flex;flex-direction:column;border:1px solid #0003;border-radius:12px;box-shadow:0 8px 22px #0005;overflow:hidden}
.nh{display:flex;align-items:center;gap:4px;padding:3px 6px;background:#0002}
.gr{flex:1;cursor:grab;font-size:15px;user-select:none;touch-action:none;padding:6px 2px;white-space:nowrap}
.nh button{border:0;background:transparent;font-size:16px;cursor:pointer;color:inherit;min-width:30px;min-height:30px}
input[type=color]{width:28px;height:28px;padding:0;border:2px solid #fff;border-radius:50%;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.note textarea{flex:1;width:100%;min-height:0;border:0;background:transparent;resize:none;padding:8px 10px;color:inherit;line-height:1.7;outline:0}
.rz{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,#0007 50% 58%,transparent 58% 70%,#0007 70% 78%,transparent 78%)}
#sheet{position:fixed;inset:0;z-index:9;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#12143A,#1D2160);padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.shw{max-width:900px;margin:0 auto}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;margin:0 -16px 14px;background:#12143Aee;backdrop-filter:blur(8px);border-bottom:2px solid var(--amber)}
.sh h2{margin:0;font-size:22px}
.qc{border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px #0005}
.qc textarea{width:100%;min-height:96px;border:0;background:transparent;font-size:19px;line-height:1.9;resize:vertical;color:inherit;outline:0}
.qc .row{margin:8px 0 0;align-items:center}
.qc .b{background:#fff;color:#1F2430;border-color:#0003;min-height:40px}
.qc .b.red{color:#A23B3B}
.nbw{padding:14px;border-radius:14px;border:1px solid #D9D2C3;background-size:cover;background-position:center}
#bar .b{padding:0 12px;min-height:40px;font-size:14px}
#bar{position:fixed;inset:auto 0 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#12143Af2;backdrop-filter:blur(10px);border-top:2px solid var(--amber);z-index:5}
#lbl{min-width:96px;text-align:center;color:var(--mute);font-size:14px}
#panel{position:fixed;inset:auto 0 0 0;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-height:55vh;overflow-y:auto;padding:16px 20px;background:#1B1F57;border-radius:22px 22px 0 0;border-top:1px solid var(--line);box-shadow:0 -8px 30px #0008;z-index:4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid #FFFFFF55;cursor:pointer}.sw.sq{border-radius:12px}
.it{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #3A3F8F}.it span{flex:1 1 220px;font-size:17px}
#nbt{width:100%;height:calc(100vh - 300px);height:calc(100dvh - 300px);min-height:320px;padding:12px;border:0;border-radius:10px;background:#FFFDF7cc;color:#1F2430;font-size:18px;line-height:1.8}
[hidden]{display:none!important}
</style>
<style>
/* تحسينات الشكل: خلفية مثقفة + ستايل NotebookLM */
:root{--line:#3C4F68}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 56px),radial-gradient(ellipse at 50% -10%,#3A5068 0%,#1B2636 48%,#101722 100%) fixed}
header,.sh{background:#101722ee;border-bottom-color:#2C3C52}
.sh{border-bottom:2px solid var(--amber)}
#bar{background:#101722f2}
#panel{background:#172231;border-radius:28px 28px 0 0}
#sheet{background:radial-gradient(ellipse at 50% -10%,#3A5068 0%,#1B2636 48%,#101722 100%)}
.cover{border-radius:6px 18px 18px 6px}
.pg,.pg canvas{border-radius:14px}
.pg{box-shadow:0 18px 50px -20px #000c}
.qc{border-radius:22px}
.note{border-radius:16px}
.nbw{border-radius:20px}
.it{border-bottom-color:#2C3C52}
#msg{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:30;margin:0;padding:10px 22px;border-radius:999px;box-shadow:0 10px 30px #0008;animation:tp .25s ease}
@keyframes tp{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.nh button{transition:transform .15s,background .2s}
.nh .sv.pop{background:#1F8A5B;color:#fff;border-radius:50%;animation:pp .3s ease}
@keyframes pp{50%{transform:scale(1.3)}}
</style>
</head>
<body data-tool="none">
<header><div class="brand"><svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4348B8"/><stop offset="1" stop-color="#12143A"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M32 20C26 16 18 16 12 18V44C18 42 26 42 32 46Z" fill="#F4F1FF"/><path d="M32 20C38 16 46 16 52 18V44C46 42 38 42 32 46Z" fill="#D7D2F4"/><path d="M38 13H46V30L42 26L38 30Z" fill="#F5B544"/><circle cx="19" cy="11" r="2.2" fill="#F5B544"/></svg><h1 id="ttl">مكتبتي</h1></div><div class="row" style="margin:0"><button class="b" id="inst" hidden>تثبيت التطبيق</button><label class="b pri">إضافة كتاب (PDF أو نص)<input id="add" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain" multiple></label></div></header>
<p id="msg" hidden></p>
<main id="lib"></main>
<main id="rd" hidden><div id="pages"></div></main>
<section id="panel" hidden></section>
<section id="sheet" hidden></section>
<nav id="bar" hidden>
<button class="b" id="home">الكتب</button><button class="b" id="pv">السابقة</button><span id="lbl"></span><button class="b" id="nx">التالية</button><button class="b" id="pen">✏️ الأدوات</button><button class="b" id="qb">❝ الاقتباسات</button><button class="b" id="svb">🔖 المحفوظات</button><button class="b" id="nbb">📓 النوت بوك</button>
</nav>
<script>
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const $=s=>document.querySelector(s);
const S={tool:'none',color:'#FFE680',qc:'#FFE680',tab:'tools',cur:0,io:null,sel:null};
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('reader',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(st,m,fn)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(st,m);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const get=(st,k)=>tx(st,'readonly',s=>s.get(k)),put=(st,v)=>tx(st,'readwrite',s=>s.put(v)),all=st=>tx(st,'readonly',s=>s.getAll()),del=(st,k)=>tx(st,'readwrite',s=>s.delete(k));
let pt;const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>put('meta',S.meta),300)};
const msg=t=>{const m=$('#msg');m.textContent=t||'';m.hidden=!t};
const COLORS=['linear-gradient(145deg,#2F8F8A,#14504D)','linear-gradient(145deg,#C0703F,#6E331A)','linear-gradient(145deg,#5560D8,#262B80)','linear-gradient(145deg,#A25BB0,#4B2358)'];
async function lib(){
 const bs=(await all('books')).sort((a,b)=>a.created-b.created);const L=$('#lib');L.innerHTML='';
 if(!bs.length){L.innerHTML='<p>مكتبتك فاضية لسه.<br>دوسي «إضافة كتاب» واختاري ملف PDF أو نص من الموبايل.</p>';return}
 bs.forEach((b,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<div class="cover"></div><button class="b red">حذف</button>';
 const cv=c.firstChild;cv.textContent=b.name;cv.style.background=COLORS[i%4];cv.onclick=()=>openBook(b.id);
 c.lastChild.onclick=async()=>{if(confirm('حذف «'+b.name+'» وكل ملاحظاته؟')){await del('books',b.id);await del('meta',b.id);lib()}};L.appendChild(c)});
}
$('#add').onchange=async e=>{
 for(const f of e.target.files){const pdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
 await put('books',{id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),type:pdf?'pdf':'txt',blob:f,created:Date.now()})}
 e.target.value='';navigator.storage&&navigator.storage.persist&&navigator.storage.persist();lib();
};
function pdfLib(){
 if(window.pdfjsLib)return Promise.resolve();
 const L=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 return L('lib/pdf.min.js').then(()=>'lib/pdf.worker.min.js').catch(()=>L(CDN+'pdf.min.js').then(()=>CDN+'pdf.worker.min.js')).then(w=>{pdfjsLib.GlobalWorkerOptions.workerSrc=w});
}
async function openBook(id){
 msg('');const b=await get('books',id);S.b=b;
 S.meta=(await get('meta',id))||{id,ann:[],saved:[],quotes:[],last:0,nb:{cur:0,pages:[{bg:'#FFFFFF',img:'',text:''}]}};
 S.meta.nb=S.meta.nb||{cur:0,pages:[{bg:'#FFFFFF',img:'',text:''}]};S.meta.saved=S.meta.saved||[];S.sel=null;
 if(S.meta.quotes&&S.meta.quotes.length){S.meta.quotes.forEach(t=>S.meta.ann.push({pg:-1,t:'quote',x:.1,y:.1,w:.8,h:.3,c:'#FFE680',text:t}));S.meta.quotes=[];persist()}
 $('#lib').hidden=true;$('#rd').hidden=false;$('#bar').hidden=false;$('#ttl').textContent=b.name;$('#pages').innerHTML='';
 S.io&&S.io.disconnect();S.pgs=[];
 try{
 if(b.type==='pdf'){await pdfLib();S.pdf=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
  const v=(await S.pdf.getPage(1)).getViewport({scale:1});
  S.io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting&&!x.target.dataset.r){x.target.dataset.r=1;renderPdf(x.target)}}),{rootMargin:'700px'});
  for(let i=0;i<S.pdf.numPages;i++)mk(i,'<canvas></canvas>',v.width+'/'+v.height);
 }else{
  const ps=(await b.blob.text()).split(/\n+/).map(t=>t.trim()).filter(Boolean);const pages=[];let c=[],n=0;
  ps.forEach(t=>{c.push(t);n+=t.length;if(n>900){pages.push(c);c=[];n=0}});if(c.length)pages.push(c);
  pages.forEach((p,i)=>{const d=mk(i,'<div class="tx"></div>');p.forEach(t=>{const e=document.createElement('p');e.textContent=t;d.querySelector('.tx').appendChild(e)});renderOv(d)});
 }}catch(err){msg('مقدرتش أفتح الكتاب ده: '+err.message);return}
 const track=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){S.cur=+x.target.dataset.i;S.meta.last=S.cur;lbl();persist()}}),{threshold:.5});
 S.pgs.forEach(p=>track.observe(p));S.track=track;
 if(S.meta.last)S.pgs[S.meta.last]&&S.pgs[S.meta.last].scrollIntoView();lbl();
}
function mk(i,inner,ratio){
 const d=document.createElement('div');d.className='pg';d.dataset.i=i;if(ratio)d.style.aspectRatio=ratio;
 d.innerHTML=inner+'<svg class="ov"></svg><div class="nt"></div>';$('#pages').appendChild(d);S.pgs.push(d);S.io&&S.io.observe(d);
 d.querySelector('svg').addEventListener('pointerdown',e=>down(e,d));return d;
}
async function renderPdf(d){
 const page=await S.pdf.getPage(+d.dataset.i+1);const v0=page.getViewport({scale:1});const sc=d.clientWidth/v0.width;const dpr=Math.min(devicePixelRatio||1,2);
 const v=page.getViewport({scale:sc*dpr});const c=d.querySelector('canvas');c.width=v.width;c.height=v.height;d.style.aspectRatio=v0.width+'/'+v0.height;
 await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;renderOv(d);
}
const lbl=()=>{$('#lbl').textContent='صفحة '+(S.cur+1)+' من '+(S.pgs?S.pgs.length:0)};
const go=n=>{const p=S.pgs[Math.max(0,Math.min(S.pgs.length-1,n))];p&&p.scrollIntoView({behavior:'smooth'})};
$('#pv').onclick=()=>go(S.cur-1);$('#nx').onclick=()=>go(S.cur+1);
$('#home').onclick=()=>{$('#rd').hidden=true;$('#bar').hidden=true;$('#panel').hidden=true;$('#lib').hidden=false;$('#ttl').textContent='مكتبتي';lib()};
const lum=c=>{const n=parseInt(c.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
const inkOn=c=>lum(c)<.5?'#FFFFFF':'#1F2430';
const SH=['circle','rect','arrow'],EDIT=['sel','circle','rect','arrow'];
const dim=a=>a.t==='arrow'?[a.rx||60,20]:a.t==='rect'?[a.rx||60,a.ry||40]:[a.rx||45,a.ry||45];
function setSel(a){const o=S.sel;S.sel=a;if(o&&o!==a&&S.pgs[o.pg])renderOv(S.pgs[o.pg])}
function renderOv(d){
 const i=+d.dataset.i,H=1000*d.clientHeight/d.clientWidth,svg=d.querySelector('svg'),nt=d.querySelector('.nt');
 svg.setAttribute('viewBox','0 0 1000 '+H);nt.innerHTML='';let s='';
 S.meta.ann.forEach(a=>{if(a.pg!==i)return;
  if(a.t==='pen'||a.t==='hl'){s+=`<polyline points="${a.p.map(q=>Math.round(q[0]*1000)+','+Math.round(q[1]*H)).join(' ')}" fill="none" stroke="${a.c}" stroke-width="${a.t==='hl'?22:3}" stroke-opacity="${a.t==='hl'?.45:1}" stroke-linecap="round" stroke-linejoin="round"/>`;return}
  if(a.t==='note'||a.t==='quote'){nt.appendChild(sticky(a,d));return}
  const X=a.x*1000,Y=a.y*H,[rx,ry]=dim(a),st='fill="none" stroke="#C2362B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  if(a.t==='circle')s+=`<ellipse cx="${X}" cy="${Y}" rx="${rx}" ry="${ry}" ${st}/>`;
  if(a.t==='rect')s+=`<rect x="${X-rx}" y="${Y-ry}" width="${2*rx}" height="${2*ry}" rx="6" ${st}/>`;
  if(a.t==='arrow'){const h=Math.min(20,rx*.4);s+=`<path d="M${X-rx} ${Y}H${X+rx}M${X+rx-h} ${Y-h}L${X+rx} ${Y}L${X+rx-h} ${Y+h}" ${st}/>`}
  if(S.sel===a&&EDIT.includes(S.tool)){s+=`<rect x="${X-rx-8}" y="${Y-ry-8}" width="${2*rx+16}" height="${2*ry+16}" fill="none" stroke="#F5B544" stroke-width="2" stroke-dasharray="8 6"/><circle cx="${X+rx}" cy="${a.t==='arrow'?Y:Y+ry}" r="16" fill="#F5B544" stroke="#1B1740" stroke-width="3"/>`}
 });
 svg.innerHTML=s;
}
function sticky(a,d){
 const q=a.t==='quote';a.w=a.w||(q?.8:.4);a.h=a.h||(q?.3:.18);a.c=a.c||(q?S.qc:'#FFE58A');
 const n=document.createElement('div');n.className='note';
 n.innerHTML=`<div class="nh"><span class="gr">${q?'❝':'📝'} ⠿</span><input type="color" aria-label="لون"><button class="sv" aria-label="حفظ في المحفوظات">💾</button><button class="x" aria-label="حذف">✕</button></div><textarea aria-label="${q?'اقتباس':'ملاحظة'}" placeholder="${q?'اكتبي أو الصقي الاقتباس هنا':'اكتبي ملاحظتك'}"></textarea><i class="rz"></i>`;
 const ta=n.querySelector('textarea'),ci=n.querySelector('input');
 const fit=()=>{const s=n.style;s.left=a.x*100+'%';s.top=a.y*100+'%';s.width=a.w*100+'%';s.height=a.h*100+'%';s.background=a.c;s.color=inkOn(a.c);ta.style.fontSize=Math.max(13,Math.min(46,d.clientWidth*a.w/(q?12:14)))+'px'};
 ta.value=a.text||'';ci.value=a.c;fit();
 ta.oninput=()=>{a.text=ta.value;persist()};
 ci.oninput=()=>{a.c=ci.value;fit();persist()};
 const sv=n.querySelector('.sv');
 sv.onclick=()=>{if(!a.text){msg('اكتبي الأول وبعدين احفظي.');setTimeout(()=>msg(''),1800);return}if(S.meta.saved.includes(a.text)){msg('محفوظة قبل كده.')}else{S.meta.saved.push(a.text);persist();panel();msg('تم الحفظ في المحفوظات ✓')}sv.textContent='✓';sv.classList.add('pop');setTimeout(()=>{sv.textContent='💾';sv.classList.remove('pop');msg('')},1800)};
 n.querySelector('.x').onclick=()=>{if(!a.text||confirm('حذف؟')){S.meta.ann.splice(S.meta.ann.indexOf(a),1);persist();renderOv(d)}};
 const gesture=(el,fn)=>el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);
  const r=d.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,o={x:a.x,y:a.y,w:a.w,h:a.h};
  const mv=ev=>{fn((ev.clientX-sx)/r.width,(ev.clientY-sy)/r.height,o);fit()},up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);persist()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
 gesture(n.querySelector('.gr'),(dx,dy,o)=>{a.x=Math.max(0,Math.min(1-a.w,o.x+dx));a.y=Math.max(0,Math.min(1-a.h,o.y+dy))});
 gesture(n.querySelector('.rz'),(dx,dy,o)=>{a.w=Math.max(.22,Math.min(1-a.x,o.w+dx));a.h=Math.max(Math.min(.5,90/d.clientHeight),Math.min(1-a.y,o.h+dy))});
 return n;
}
function hitShape(i,px,py,H){const A=S.meta.ann;for(let k=A.length-1;k>=0;k--){const a=A[k];if(a.pg!==i||!SH.includes(a.t))continue;const[rx,ry]=dim(a);if(Math.abs(px-a.x*1000)<=rx+20&&Math.abs(py-a.y*H)<=ry+20)return a}return null}
function down(e,d){
 const t=S.tool;if(t==='none')return;const r=d.getBoundingClientRect(),svg=e.currentTarget,i=+d.dataset.i;
 const P=ev=>[(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height],[x,y]=P(e),H=1000*r.height/r.width,px=x*1000,py=y*H;
 const drag=mv=>{svg.setPointerCapture(e.pointerId);const m2=ev=>{mv(P(ev));renderOv(d)},up=()=>{svg.removeEventListener('pointermove',m2);svg.removeEventListener('pointerup',up);svg.removeEventListener('pointercancel',up);persist();renderOv(d)};
  svg.addEventListener('pointermove',m2);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up)};
 const sh=S.sel&&S.sel.pg===i&&EDIT.includes(t)?S.sel:null;
 if(sh){const[rx,ry]=dim(sh),hx=sh.x*1000+rx,hy=sh.y*H+(sh.t==='arrow'?0:ry);
  if(Math.hypot(px-hx,py-hy)<45){e.preventDefault();drag(q=>{sh.rx=Math.max(14,q[0]*1000-sh.x*1000);if(sh.t!=='arrow')sh.ry=Math.max(14,q[1]*H-sh.y*H)});return}}
 if(t==='pen'||t==='hl'){e.preventDefault();const a={pg:i,t,c:t==='pen'?'#1F2430':S.color,p:[[x,y]]};S.meta.ann.push(a);renderOv(d);drag(q=>{a.p.push(q)});return}
 if(t==='erase'){const k=S.meta.ann.findIndex(a=>{if(a.pg!==i||a.t==='note'||a.t==='quote')return false;if(a.p)return a.p.some(q=>Math.hypot((q[0]-x)*1000,(q[1]-y)*H)<35);const[rx,ry]=dim(a);return Math.abs(px-a.x*1000)<=rx+20&&Math.abs(py-a.y*H)<=ry+20});
  if(k>=0){if(S.sel===S.meta.ann[k])S.sel=null;S.meta.ann.splice(k,1);persist();renderOv(d)}return}
 if(t==='sel'){e.preventDefault();const h=hitShape(i,px,py,H);setSel(h);renderOv(d);if(h){const x0=x,y0=y,ox=h.x,oy=h.y;drag(q=>{h.x=ox+q[0]-x0;h.y=oy+q[1]-y0})}return}
 if(SH.includes(t)){e.preventDefault();const a={pg:i,t,x,y};if(t==='circle'){a.rx=45;a.ry=45}if(t==='rect'){a.rx=60;a.ry=40}if(t==='arrow')a.rx=60;
  S.meta.ann.push(a);setSel(a);renderOv(d);let mvd=false;
  drag(q=>{const dx=q[0]*1000-px,dy=q[1]*H-py;if(Math.hypot(dx,dy)>14)mvd=true;if(!mvd)return;a.x=(x+q[0])/2;a.rx=Math.max(t==='arrow'?20:14,Math.abs(dx)/2);if(t!=='arrow'){a.y=(y+q[1])/2;a.ry=Math.max(14,Math.abs(dy)/2)}});return}
 if(t==='note'||t==='quote'){const w=t==='quote'?.8:.45,h=Math.min(t==='quote'?.3:.2,Math.max(.07,(t==='quote'?240:150)/r.height));let text='';
  if(t==='quote'){const p=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.tagName==='P');if(p)text=p.textContent}
  S.meta.ann.push({pg:i,t,x:t==='quote'?(1-w)/2:Math.max(0,Math.min(x,1-w)),y:Math.max(0,Math.min(y,1-h)),w,h,c:t==='quote'?S.qc:'#FFE58A',text});persist();renderOv(d);
  S.tool='none';document.body.dataset.tool='none';$('#panel').hidden=true;$('#pen').classList.remove('on');
  const ns=d.querySelectorAll('.note');if(ns.length){const nn=ns[ns.length-1];nn.scrollIntoView({block:'nearest'});if(!text)nn.querySelector('textarea').focus()}}
}
const TOOLS=[['none','👆 قراءة / تمرير'],['pen','✏️ قلم'],['hl','🖍 هايلايتر'],['quote','❝ اقتباس'],['note','📝 ملاحظة'],['arrow','➡️ سهم'],['circle','⭕ دايرة'],['rect','⬜ مربع'],['sel','↔️ تحريك / تكبير / تصغير'],['erase','🧽 مسح']];
const PAL=['#FFE680','#BFE8C0','#BFDDF5','#F7C6D9','#FFD3A6','#E3C9F5','#FFB3A7','#D9D9D9'],BG=['#FFFFFF','#F6EBD0','#E6E8EC','#DCEBFA','#DDF1DF','#9AA3B2'];
const sw=(arr,act,cur)=>arr.map(c=>`<button class="sw" aria-label="لون" data-a="${act}" data-v="${c}" style="background:${c};${cur===c?'border:3px solid #F5B544':''}"></button>`).join('');
function panel(){
 const p=$('#panel');if(p.hidden)return;p.style.bottom=$('#bar').offsetHeight+'px';const m=S.meta;if(S.tab!=='saved')S.tab='tools';
 const tabs=[['tools','🛠 الأدوات'],['saved','🔖 المحفوظات']].map(([k,l])=>`<button class="b ${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')+'<button class="b" data-a="sheet" data-v="quotes">❝ الاقتباسات</button><button class="b" data-a="sheet" data-v="nb">📓 النوت بوك</button>';
 let h=`<div class="row">${tabs}</div>`;
 if(S.tab==='tools')h+=`<div class="row">${TOOLS.map(([k,l])=>`<button class="b ${S.tool===k?'on':''}" data-a="tool" data-v="${k}">${l}</button>`).join('')}</div><div class="row"><span>لون الهايلايتر:</span>${sw(PAL,'col',S.color)}<input type="color" id="hci" value="${S.color}" aria-label="لون آخر"></div><div class="row"><span>لون الاقتباس:</span>${sw(PAL,'qcol',S.qc)}<input type="color" id="qci" value="${S.qc}" aria-label="لون آخر"></div><p style="font-size:14px;margin:0;line-height:1.8">اختاري أداة ودوسي على الصفحة. الدايرة والمربع والسهم: اسحبي بصباعك لتحديد الحجم، وبعدها اسحبي النقطة الصفرا لتكبير أو تصغير. أداة «تحريك / تكبير / تصغير» تعدّل أي شكل قديم. الاقتباس والملاحظة: اسحبي ⠿ للتحريك والزاوية السفلية للتكبير.</p>`;
 else h+=m.saved.length?m.saved.map((t,i)=>`<div class="it"><span></span><button class="b red" data-a="rm" data-v="${i}">حذف</button></div>`).join(''):'<p>لسه فاضي.</p>';
 p.innerHTML=h;
 if(S.tab==='saved')p.querySelectorAll('.it span').forEach((s,i)=>s.textContent=m.saved[i]);
 else{const hc=p.querySelector('#hci'),qc=p.querySelector('#qci');hc.oninput=()=>{S.color=hc.value;S.tool='hl';document.body.dataset.tool='hl'};qc.oninput=()=>{S.qc=qc.value;S.tool='quote';document.body.dataset.tool='quote'}}
}
$('#panel').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='sheet'){openSheet(v);return}
 if(a==='tab')S.tab=v;
 if(a==='tool'){S.tool=v;document.body.dataset.tool=v;if(!EDIT.includes(v)){const o=S.sel;S.sel=null;if(o&&S.pgs[o.pg])renderOv(S.pgs[o.pg])}}
 if(a==='col'){S.color=v;S.tool='hl';document.body.dataset.tool='hl'}
 if(a==='qcol'){S.qc=v;S.tool='quote';document.body.dataset.tool='quote'}
 if(a==='rm')S.meta.saved.splice(+v,1);
 persist();panel()};
$('#pen').onclick=()=>{const p=$('#panel');p.hidden=!p.hidden;$('#pen').classList.toggle('on',!p.hidden);panel()};
function openSheet(k){S.sheet=k;$('#sheet').hidden=false;$('#sheet').scrollTop=0;sheet()}
function closeSheet(){S.sheet=null;$('#sheet').hidden=true;if(S.pgs)S.pgs.forEach(d=>renderOv(d))}
const head=t=>`<div class="sh"><h2>${t}</h2><button class="b pri" id="shx">رجوع للكتاب</button></div>`;
function sheet(){
 const el=$('#sheet'),m=S.meta,k=S.sheet;
 if(k==='quotes'){
  const Q=m.ann.filter(a=>a.t==='quote').sort((a,b)=>a.pg-b.pg||a.y-b.y);
  el.innerHTML=`<div class="shw">${head('❝ الاقتباسات')}<p style="color:var(--mute);line-height:1.9">لإضافة اقتباس: ارجعي للكتاب ← «✏️ الأدوات» ← «❝ اقتباس» ← دوسي على المكان في الصفحة.</p>${Q.length?'':'<p>لسه مفيش اقتباسات.</p>'}<div id="ql"></div></div>`;
  const L=el.querySelector('#ql');
  Q.forEach(a=>{a.c=a.c||'#FFE680';const c=document.createElement('div');c.className='qc';
   c.innerHTML='<div class="row" style="justify-content:space-between"><b></b><input type="color" aria-label="لون"></div><textarea aria-label="نص الاقتباس"></textarea><div class="row"><button class="b" data-g>اذهبي للصفحة</button><button class="b" data-s>حفظ</button><button class="b" data-c>نسخ</button><button class="b red" data-d>حذف</button></div>';
   const ta=c.querySelector('textarea'),ci=c.querySelector('input'),paint=()=>{c.style.background=a.c;c.style.color=inkOn(a.c)};
   c.querySelector('b').textContent=a.pg>=0?'صفحة '+(a.pg+1):'اقتباس قديم';ta.value=a.text||'';ci.value=a.c;paint();
   ta.oninput=()=>{a.text=ta.value;persist()};ci.oninput=()=>{a.c=ci.value;paint();persist()};
   const g=c.querySelector('[data-g]');if(a.pg<0)g.remove();else g.onclick=()=>{closeSheet();go(a.pg)};
   c.querySelector('[data-s]').onclick=e=>{if(!a.text)return;if(!m.saved.includes(a.text)){m.saved.push(a.text);persist()}e.target.textContent='تم الحفظ ✓'};
   c.querySelector('[data-c]').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(a.text||'').then(()=>{e.target.textContent='تم النسخ ✓'})};
   c.querySelector('[data-d]').onclick=()=>{if(confirm('حذف الاقتباس؟')){m.ann.splice(m.ann.indexOf(a),1);persist();sheet()}};
   L.appendChild(c)});
 }
 if(k==='nb'){
  const n=m.nb,pg=n.pages[n.cur];
  el.innerHTML=`<div class="shw">${head('📓 النوت بوك')}<div class="row"><button class="b" data-a="np">السابقة</button><span>صفحة ${n.cur+1} من ${n.pages.length}</span><button class="b" data-a="nn">التالية</button><button class="b" data-a="na">+ صفحة جديدة</button><button class="b red" data-a="nd">حذف الصفحة</button></div><div class="row"><span>الخلفية:</span>${BG.map(c=>`<button class="sw sq" aria-label="خلفية" data-a="bg" data-v="${c}" style="background:${c}"></button>`).join('')}<input type="color" id="bgc" value="${/^#[0-9a-f]{6}$/i.test(pg.bg)?pg.bg:'#FFFFFF'}" aria-label="لون آخر"><label class="b">صورة من الموبايل<input type="file" accept="image/*" id="bgi"></label><button class="b" data-a="bn">شيل الصورة</button></div><div class="nbw" style="background-color:${pg.bg};${pg.img?`background-image:url(${pg.img})`:''}"><textarea id="nbt" aria-label="صفحة النوت بوك"></textarea></div></div>`;
  const t=el.querySelector('#nbt');t.value=pg.text;t.oninput=()=>{pg.text=t.value;persist()};
  el.querySelector('#bgc').oninput=e=>{pg.bg=e.target.value;el.querySelector('.nbw').style.backgroundColor=pg.bg;persist()};
  el.querySelector('#bgi').onchange=e=>{const f=e.target.files[0];if(!f)return;createImageBitmap(f).then(im=>{const q=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*q;c.height=im.height*q;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pg.img=c.toDataURL('image/jpeg',.8);persist();sheet()}).catch(()=>msg('مقدرتش أقرأ الصورة دي.'))};
 }
}
$('#sheet').onclick=e=>{if(e.target.closest('#shx'))return closeSheet();const b=e.target.closest('[data-a]');if(!b||S.sheet!=='nb')return;
 const a=b.dataset.a,v=b.dataset.v,n=S.meta.nb,pg=n.pages[n.cur];
 if(a==='np')n.cur=Math.max(0,n.cur-1);if(a==='nn')n.cur=Math.min(n.pages.length-1,n.cur+1);
 if(a==='na'){n.pages.push({bg:'#FFFFFF',img:'',text:''});n.cur=n.pages.length-1}
 if(a==='nd'&&n.pages.length>1){n.pages.splice(n.cur,1);n.cur=Math.max(0,n.cur-1)}
 if(a==='bg')pg.bg=v;if(a==='bn')pg.img='';
 persist();sheet()};
$('#svb').onclick=()=>{S.tab='saved';const p=$('#panel');p.hidden=false;$('#pen').classList.add('on');panel()};
$('#qb').onclick=()=>openSheet('quotes');$('#nbb').onclick=()=>openSheet('nb');
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=()=>{dp&&dp.prompt();$('#inst').hidden=true};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
lib();
